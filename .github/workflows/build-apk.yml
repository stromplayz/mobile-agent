name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (pre-installed on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Fix Gradle wrapper version (8.13 for Expo SDK 57 compat)
        run: |
          sed -i 's|gradle-9\.[0-9.]*-bin\.zip|gradle-8.13-bin.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2

      - name: List built APK
        run: find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Rename APK to a friendly name
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifact/mobile-agent-debug.apk"
          ls -lh artifact/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-debug-apk
          path: artifact/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: artifact/*.apk
          body: |
            ## Mobile Agent — Debug APK

            Built from commit ${{ github.sha }}

            ### Installation
            1. Download the `.apk` file below
            2. Enable "Install unknown apps" in Android settings
            3. Tap the APK to install
            4. Package: `com.tecnicalbot.mobileagent`

            ### Features
            - Bundled terminal (Termux-like, no external Termux needed)
            - Multi-agent parallel runs (orchestrator + workers)
            - Nested projects with persistent folder binding
            - Brutalist square UI with tablet support
            - All model providers: OpenAI, Anthropic, Gemini, Ollama, OpenAI-compatible
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
